included:
  - CoreAISamples
  - SpeechPhone
  - CoreAISamplesKit/Sources
  - CoreAISamplesKit/Tests
  - Vendor/IrodoriInputKit/Sources

excluded:
  - .build
  - DerivedData
  - build

only_rules:

  - force_cast
  - force_try
  - force_unwrapping

  - duplicate_conditions
  - duplicate_enum_cases
  - duplicated_key_in_dictionary_literal
  - identical_operands

  - unowned_variable_capture
  - unhandled_throwing_task

  - blanket_disable_command
  - invalid_swiftlint_command
  - superfluous_disable_command

  - custom_rules

custom_rules:

  pure_logic_imports:
    included: ".*/CoreAISamplesKit/Sources/(FeatureStore|GLiNERCore|ExtractFeature|DecideFeature|ProductCore|ProductFeature|RecipeCore|RecipeFeature|EmbeddingCore|TruckInspectionCore|TruckInspectionFeature|ImageSearchFeature|ConversationFeature|SpeechCore|SpeechFeature)/.*\\.swift"
    excluded: ".*/CoreAISamplesKit/Sources/FeatureStore/Store\\.swift"
    regex: '\bimport\s+(?:(?:typealias|struct|class|enum|protocol|let|var|func)\s+)?+(?!(?:Foundation|FeatureStore|GLiNERCore|ExtractFeature|DecideFeature|ProductCore|ProductFeature|RecipeCore|RecipeFeature|EmbeddingCore|TruckInspectionCore|TruckInspectionFeature|ImageSearchFeature|SpeechCore|SpeechFeature)\b)\w+'
    match_kinds: [keyword, identifier]
    message: "Pure-logic targets may import only Foundation and other pure-logic targets (A2)."
    severity: error

  pure_logic_no_concurrency:
    included: ".*/CoreAISamplesKit/Sources/(FeatureStore|GLiNERCore|ExtractFeature|DecideFeature|ProductCore|ProductFeature|RecipeCore|RecipeFeature|EmbeddingCore|TruckInspectionCore|TruckInspectionFeature|ImageSearchFeature|ConversationFeature|SpeechCore|SpeechFeature)/.*\\.swift"
    excluded: ".*/CoreAISamplesKit/Sources/FeatureStore/Store\\.swift"
    regex: '\b(async|await|actor|Task)\b'
    match_kinds: [keyword, identifier, typeidentifier]
    message: "Keep async, await, actors and tasks out of pure logic (A2)."
    severity: error

  pure_logic_no_ambient:
    included: ".*/CoreAISamplesKit/Sources/(FeatureStore|GLiNERCore|ExtractFeature|DecideFeature|ProductCore|ProductFeature|RecipeCore|RecipeFeature|EmbeddingCore|TruckInspectionCore|TruckInspectionFeature|ImageSearchFeature|ConversationFeature|SpeechCore|SpeechFeature)/.*\\.swift"
    regex: '\bDate\(\)|\bDate\.now\b|\bUUID\(\)|\.random\(|\.randomElement\(\)|\.shuffled?\(\)|\b(Calendar|TimeZone|Locale)\.(current|autoupdatingCurrent)\b'
    match_kinds: [identifier, typeidentifier]
    message: "Pass time, randomness, identifiers and locale settings into pure logic (A3)."
    severity: error

  observable_no_await:
    excluded: ".*/CoreAISamplesKit/Sources/FeatureStore/Store\\.swift"
    regex: '@Observable\b.*\bawait\b|\bawait\b.*@Observable\b'
    message: "Put asynchronous state transitions in a Feature and its Store (A4)."
    severity: error

  task_only_in_store:
    excluded:
      - ".*/CoreAISamplesKit/Sources/FeatureStore/Store\\.swift"
      - ".*/CoreAISamplesKit/Tests/.*"
    regex: '\bTask\s*(<[^>]*>\s*)?(\.detached\s*)?[\{\(]'
    match_kinds: [identifier, typeidentifier]
    message: "Create tasks only in the shared Store or explicitly recorded existing entry points (A4)."
    severity: error

  concurrency_escape:
    regex: '@unchecked\s+Sendable|nonisolated\s*\(\s*unsafe\s*\)|@preconcurrency\s+import'
    match_kinds: [attribute.builtin, keyword, identifier, typeidentifier]
    message: "Record the safety invariant in CLAUDE.md and review any existing baseline exception (A12)."
    severity: error

  no_inline_swiftlint_commands:
    regex: 'swiftlint:(disable|enable)(:next|:this|:previous)?\b'
    message: "Inline SwiftLint commands are not allowed; record reviewed existing exceptions in the baseline."
    severity: error

  no_xctest_in_swift_testing:
    included: ".*/CoreAISamplesKit/Tests/.*\\.swift"
    regex: '\b(XCTest|XCTAssert\w*|XCTFail|XCTUnwrap|XCTExpectFailure)\b'
    match_kinds: [identifier, typeidentifier]
    message: "Use Testing APIs in Swift Testing tests and their helpers (T2)."
    severity: error

  test_no_real_time_wait:
    included: ".*/CoreAISamplesKit/Tests/.*\\.swift"
    regex: '\b(Task|Thread)\.sleep\b|(?<![\w.])u?sleep\('
    match_kinds: [identifier, typeidentifier]
    message: "Control test ordering with a fake instead of real-time sleeps (T8)."
    severity: error
