included:
  - CoreAISamples
  - CoreAISamplesKit/Sources
  - CoreAISamplesKit/Tests

excluded:
  - .build
  - DerivedData
  - build

only_rules:
  - cyclomatic_complexity
  - function_body_length
  - type_body_length
  - file_length

cyclomatic_complexity:
  warning: 10
  error: 20
function_body_length:
  warning: 50
  error: 100
type_body_length:
  warning: 250
  error: 350
file_length:
  warning: 400
  error: 1000
