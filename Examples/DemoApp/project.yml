name: DemoApp

options:
  bundleIdPrefix: com.coreai-samples
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: false
  minimumXcodeGenVersion: "2.0.0"

configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

fileGroups:
  - Local.xcconfig.template

settings:
  base:
    EXCLUDED_ARCHS: x86_64

packages:
  CoreAISamples:
    path: ../..

targets:
  DemoApp:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: DemoApp
    dependencies:
      - package: CoreAISamples
        product: CoreAIBackend
      - package: CoreAISamples
        product: RAGContext
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreai-samples.DemoApp
        PRODUCT_NAME: DemoApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Core AI Demos
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: "NO"
        ENABLE_APP_SANDBOX: "NO"

schemes:
  DemoApp:
    build:
      targets:
        DemoApp: all
    run:
      config: Release
    profile:
      config: Release
    archive:
      config: Release
  DemoApp-Debug:
    build:
      targets:
        DemoApp: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
