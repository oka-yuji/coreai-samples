name: CoreAISamples

options:
  bundleIdPrefix: com.coreai-samples
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: false
  minimumXcodeGenVersion: "2.0.0"

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

fileGroups:
  - Config/Local.xcconfig.template

settings:
  base:
    EXCLUDED_ARCHS: x86_64

packages:
  CoreAISamplesKit:
    path: CoreAISamplesKit

targets:
  CoreAISamples:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: CoreAISamples
    dependencies:
      - package: CoreAISamplesKit
        product: CoreAIBackend
      - package: CoreAISamplesKit
        product: RAGContext
      - package: CoreAISamplesKit
        product: FeatureStore
      - package: CoreAISamplesKit
        product: ExtractFeature
      - package: CoreAISamplesKit
        product: GLiNERCore
      - package: CoreAISamplesKit
        product: GLiNERRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreai-samples.DemoApp
        PRODUCT_NAME: CoreAISamples
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Core AI Demos
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: "NO"
        ENABLE_APP_SANDBOX: "NO"

  # Extract only, on a device: the iOS Simulator SDK has no CoreAI.framework. It shares the Extract sources with the
  # Mac app; the files only the iPhone uses are in CoreAISamples/iOS.
  CoreAISamples-iOS:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: CoreAISamples/iOS
      - path: CoreAISamples/LaunchArguments.swift
      - path: CoreAISamples/Demos/ModelManager/ModelStorage.swift
      - path: CoreAISamples/Demos/Extract
        excludes:
          - ExtractView.swift
          - FieldEditor.swift
          - FieldRow.swift
          - NoteEditor.swift
    dependencies:
      - package: CoreAISamplesKit
        product: FeatureStore
      - package: CoreAISamplesKit
        product: ExtractFeature
      - package: CoreAISamplesKit
        product: GLiNERCore
      - package: CoreAISamplesKit
        product: GLiNERRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreai-samples.DemoApp.ios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "27.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Core AI Demos
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"

schemes:
  CoreAISamples:
    build:
      targets:
        CoreAISamples: all
    run:
      config: Release
    profile:
      config: Release
    archive:
      config: Release
  CoreAISamples-Debug:
    build:
      targets:
        CoreAISamples: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
  CoreAISamples-iOS:
    build:
      targets:
        CoreAISamples-iOS: all
    run:
      config: Release
    profile:
      config: Release
    archive:
      config: Release
