name: CoreAISamples

options:
  bundleIdPrefix: com.coreai-samples
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: false
  minimumXcodeGenVersion: "2.0.0"
  developmentLanguage: en
  knownRegions:
    - en
    - ja

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

fileGroups:
  - SpeechPhone/Info.plist
  - Config/Local.xcconfig.template

settings:
  base:
    EXCLUDED_ARCHS: x86_64

packages:
  CoreAISamplesKit:
    path: CoreAISamplesKit

targets:
  CoreAISamples:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: CoreAISamples
    preBuildScripts:
      - name: Build Irodori input library
        script: '"$SRCROOT/Tools/Irodori/build-inputs.sh"'
        shell: /bin/bash
        basedOnDependencyAnalysis: false
    dependencies:
      - package: CoreAISamplesKit
        product: ImageDiagnosticFeature
      - package: CoreAISamplesKit
        product: ImageGenerationRuntime
      - package: CoreAISamplesKit
        product: SpeechCore
      - package: CoreAISamplesKit
        product: SpeechFeature
      - package: CoreAISamplesKit
        product: SpeechRuntime
      - package: CoreAISamplesKit
        product: EmbeddingCore
      - package: CoreAISamplesKit
        product: EmbeddingRuntime
      - package: CoreAISamplesKit
        product: ImageSearchFeature
      - package: CoreAISamplesKit
        product: ImageSearchRuntime
      - package: CoreAISamplesKit
        product: CoreAIBackend
      - package: CoreAISamplesKit
        product: RAGContext
      - package: CoreAISamplesKit
        product: FeatureStore
      - package: CoreAISamplesKit
        product: ProductCore
      - package: CoreAISamplesKit
        product: ProductRuntime
      - package: CoreAISamplesKit
        product: ProductFeature
      - package: CoreAISamplesKit
        product: ExtractFeature
      - package: CoreAISamplesKit
        product: GLiNERCore
      - package: CoreAISamplesKit
        product: GLiNERRuntime
      - package: CoreAISamplesKit
        product: DecideFeature
      - package: CoreAISamplesKit
        product: DecideRuntime
      - package: CoreAISamplesKit
        product: RecipeCore
      - package: CoreAISamplesKit
        product: RecipeRuntime
      - package: CoreAISamplesKit
        product: RecipeFeature
      - package: CoreAISamplesKit
        product: ConversationFeature
      - package: CoreAISamplesKit
        product: ConversationRuntime
      - package: CoreAISamplesKit
        product: ExtractRuntime
      - package: CoreAISamplesKit
        product: ModelLibraryRuntime
      - package: CoreAISamplesKit
        product: VideoSearchFeature
      - package: CoreAISamplesKit
        product: VideoSearchRuntime
      - sdk: AVKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreai-samples.DemoApp
        PRODUCT_NAME: CoreAISamples
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Core AI Demos
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: "NO"
        ENABLE_APP_SANDBOX: "NO"

  CoreAISamples-iOS:
    type: application
    platform: iOS
    info:
      path: Config/Info-iOS.plist
      properties:
        UIFileSharingEnabled: true
    deploymentTarget: "27.0"
    sources:
      - path: CoreAISamples/Demos/ImageSearch
      - path: CoreAISamples/Demos/ImageGeneration
      - path: CoreAISamples/Demos/VideoSearch
      - path: CoreAISamples/Resources/Recipes
      - path: CoreAISamples/Demos/Products
      - path: CoreAISamples/Localization/DemoLanguage.swift
      - path: CoreAISamples/Resources/Localizable.xcstrings
      - path: CoreAISamples/Resources/InfoPlist.xcstrings
      - path: CoreAISamples/Resources/object-finder-examples.json
      - path: CoreAISamples/Resources/product-preview.json
      - path: CoreAISamples/Resources/image-search-queries.json
      - path: CoreAISamples/Resources/video-search-queries.json
      - path: CoreAISamples/Resources/image-search-reference.json
      - path: CoreAISamples/Resources/EmbeddingValidation
      - path: CoreAISamples/iOS
      - path: CoreAISamples/LaunchArguments.swift
      - path: CoreAISamples/Demos/ModelManager/ModelStorage.swift
      - path: CoreAISamples/Demos/Extract
        excludes:
          - ExtractView.swift
          - FieldEditor.swift
          - FieldRow.swift
          - NoteEditor.swift
    dependencies:
      - package: CoreAISamplesKit
        product: ImageDiagnosticFeature
      - package: CoreAISamplesKit
        product: ImageGenerationRuntime
      - package: CoreAISamplesKit
        product: ObjectFinderRuntime
      - package: CoreAISamplesKit
        product: ObjectFinderFeature
      - package: CoreAISamplesKit
        product: ObjectFinderCore
      - package: CoreAISamplesKit
        product: TruckInspectionCore
      - package: CoreAISamplesKit
        product: TruckInspectionFeature
      - package: CoreAISamplesKit
        product: TruckInspectionRuntime
      - package: CoreAISamplesKit
        product: EmbeddingCore
      - package: CoreAISamplesKit
        product: EmbeddingRuntime
      - package: CoreAISamplesKit
        product: ImageSearchFeature
      - package: CoreAISamplesKit
        product: ImageSearchRuntime
      - package: CoreAISamplesKit
        product: FeatureStore
      - package: CoreAISamplesKit
        product: ProductCore
      - package: CoreAISamplesKit
        product: ProductRuntime
      - package: CoreAISamplesKit
        product: ProductFeature
      - package: CoreAISamplesKit
        product: ExtractFeature
      - package: CoreAISamplesKit
        product: GLiNERCore
      - package: CoreAISamplesKit
        product: GLiNERRuntime
      - package: CoreAISamplesKit
        product: ModelLibraryUI
      - package: CoreAISamplesKit
        product: ModelLibraryFeature
      - package: CoreAISamplesKit
        product: ModelLibraryStorage
      - package: CoreAISamplesKit
        product: ModelLibraryTransfer
      - package: CoreAISamplesKit
        product: ModelLibraryRuntime
      - package: CoreAISamplesKit
        product: ExtractRuntime
      - package: CoreAISamplesKit
        product: VideoSearchFeature
      - package: CoreAISamplesKit
        product: VideoSearchRuntime
      - package: CoreAISamplesKit
        product: OCRCore
      - package: CoreAISamplesKit
        product: OCRRuntime
      - sdk: AVKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreai-samples.DemoApp.ios
        CODE_SIGN_ENTITLEMENTS: Config/CoreAISamples-iOS.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "27.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Core AI Demos
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_NSCameraUsageDescription: "Find the objects you name using on-device image analysis."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Use the microphone to enter truck inspection results by voice."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Recognize Japanese inspection answers on this device."
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"

  SpeechPhone:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: SpeechPhone
        excludes:
          - Info.plist
      - path: CoreAISamples/Demos/Speech/SpeechExport.swift
      - path: CoreAISamples/Demos/Speech/Resources/speech-examples.json
    preBuildScripts:
      - name: Build Irodori input library for iPhone
        script: '"$SRCROOT/Tools/Irodori/build-inputs.sh" iphoneos'
        shell: /bin/bash
        basedOnDependencyAnalysis: false
    dependencies:
      - package: CoreAISamplesKit
        product: SpeechCore
      - package: CoreAISamplesKit
        product: SpeechFeature
      - package: CoreAISamplesKit
        product: SpeechRuntime
      - package: CoreAISamplesKit
        product: FeatureStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreai-samples.SpeechPhone
        PRODUCT_NAME: SpeechPhone
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: YES
        SWIFT_UPCOMING_FEATURE_INFER_ISOLATED_CONFORMANCES: YES
        IPHONEOS_DEPLOYMENT_TARGET: "27.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SpeechPhone/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Irodori Speech
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_ENTITLEMENTS: Config/SpeechPhone.entitlements

schemes:
  CoreAISamples:
    build:
      targets:
        CoreAISamples: all
    run:
      config: Release
    profile:
      config: Release
    archive:
      config: Release
  CoreAISamples-Debug:
    build:
      targets:
        CoreAISamples: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
  CoreAISamples-iOS:
    build:
      targets:
        CoreAISamples-iOS: all
    run:
      config: Release
    profile:
      config: Release
    archive:
      config: Release

  SpeechPhone:
    build:
      targets:
        SpeechPhone: all
    run:
      config: Release
    profile:
      config: Release
    archive:
      config: Release
